<!DOCTYPE html>
<html lang="ko" data-state="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>야구알리미 — KBO 순위·팀·선수·뉴스</title>
<meta name="description" content="KBO 리그 순위, 구단별 성적과 선수단, 선수 정보, 야구 뉴스를 한 화면에서 봅니다.">
<!-- 홈 화면에 추가하면 주소창·툴바 없이 앱처럼 뜬다 (AGENTS.md 7절 "앱(PWA)") -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d2b52">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="야구알리미">
<!-- 머리띠가 어두운 남색이라 아이폰 상태 표시줄을 그 위에 겹친다. 가려지는 만큼은 safe-area 여백으로 비킨다 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#standings" aria-label="야구알리미 첫 화면(순위)">
      <svg class="brand-ball" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.2" fill="#fff"/>
        <path d="M7.4 4.6c1.9 1.9 3 4.5 3 7.4s-1.1 5.5-3 7.4M16.6 4.6c-1.9 1.9-3 4.5-3 7.4s1.1 5.5 3 7.4" fill="none" stroke="#d7263d" stroke-width="1.4" stroke-dasharray="1.6 1.4"/>
      </svg>
      <!-- 제목 뒤 이름("for ○○")은 기기마다 '내 팀' 창에서 정한다(이 기기의 localStorage 에만).
           공개 사이트·저장소에는 사람 이름을 넣지 않는다 (사용자 결정, AGENTS.md 9절) -->
      <span class="brand-name" id="brandName">야구알리미</span>
      <span class="brand-for" id="brandFor" hidden></span>
      <span class="brand-season" id="seasonLabel">KBO</span>
    </a>

    <nav class="tabs" aria-label="주 메뉴">
      <a class="tab" href="#standings" data-view="standings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v4.5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5.2a3 3 0 0 0 3.1 4.2M16 6h2.8a3 3 0 0 1-3.1 4.2"/><path d="M12 12.5V16M8.5 20h7M10 16h4v4h-4z"/></svg>
        <span>순위</span>
      </a>
      <a class="tab" href="#teams" data-view="teams">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l7 2.8v5.2c0 4.4-2.9 7.7-7 9.6-4.1-1.9-7-5.2-7-9.6V6l7-2.8z"/><path d="M9 11.5l2 2 4-4"/></svg>
        <span>팀</span>
      </a>
      <a class="tab" href="#players" data-view="players">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.2c.9-3.7 3.7-6.2 7.2-6.2s6.3 2.5 7.2 6.2"/></svg>
        <span>선수</span>
      </a>
      <a class="tab" href="#news" data-view="news">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.8" y="4.8" width="13.4" height="15.2" rx="2"/><path d="M17.2 9H20v9a2 2 0 0 1-2 2"/><path d="M7.4 9h6.2M7.4 12.5h6.2M7.4 16h4"/></svg>
        <span>뉴스</span>
      </a>
    </nav>

    <div class="top-actions">
      <button type="button" class="myteam-btn" id="myTeamBtn" aria-haspopup="dialog" aria-controls="teamSheet">
        <span class="myteam-label">내 팀</span>
        <span class="myteam-value" id="myTeamValue">고르기</span>
      </button>
      <!-- 앱(홈 화면)으로 실행했을 때만 보인다 — 앱에는 브라우저 새로고침 버튼이 없다 -->
      <button type="button" class="icon-btn" id="refreshBtn" hidden aria-label="새 자료 받기" title="새 자료 받기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.6 11.2a7.7 7.7 0 1 0-2.2 5.6"/><path d="M19.8 4.6v6.6h-6.6"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <noscript><p class="empty">이 앱은 자바스크립트가 켜져 있어야 동작합니다.</p></noscript>
  <section class="view" id="view-standings" data-view="standings" aria-label="순위"></section>
  <section class="view" id="view-teams" data-view="teams" aria-label="팀" hidden></section>
  <section class="view" id="view-players" data-view="players" aria-label="선수" hidden></section>
  <section class="view" id="view-news" data-view="news" aria-label="뉴스" hidden></section>
</main>

<footer class="foot" id="foot"></footer>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- 내 팀 고르기 -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="teamSheet" role="dialog" aria-modal="true" aria-labelledby="teamSheetTitle" hidden>
  <div class="sheet-head">
    <h2 id="teamSheetTitle">내 팀 고르기</h2>
    <button type="button" class="icon-btn sheet-close" id="teamSheetClose" aria-label="닫기">✕</button>
  </div>
  <p class="sheet-note">고른 팀은 순위표에서 강조되고, 팀·뉴스 화면에서 먼저 보입니다. 이 기기에만 저장됩니다.</p>
  <div class="sheet-list" id="teamSheetList"></div>
  <form class="sheet-owner" id="ownerForm" autocomplete="off">
    <label for="ownerInput">제목 뒤에 이름 붙이기 <small>(이 기기에만 저장 — 비우면 뺍니다)</small></label>
    <div class="owner-row">
      <input id="ownerInput" maxlength="20" placeholder="예: 이름" enterkeyhint="done">
      <button type="submit" class="btn" id="ownerSave">저장</button>
    </div>
  </form>
</div>

<!-- 선수 사진 크게 보기 (누르거나 뒤로 가기·Esc 로 닫는다) -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="사진 크게 보기" hidden>
  <button type="button" class="icon-btn lb-close" id="lightboxClose" aria-label="사진 닫기">✕</button>
  <figure class="lb-figure">
    <img id="lightboxImg" alt="">
    <figcaption id="lightboxCaption"></figcaption>
  </figure>
</div>

<!-- 앱 설치 안내: 안드로이드 크롬은 설치 버튼, 아이폰·아이패드는 공유 버튼 안내 글 -->
<div class="install-bar" id="install-bar" role="region" aria-label="앱 설치 안내" hidden>
  <p id="install-text"></p>
  <button type="button" class="btn" id="install-btn" hidden>앱으로 설치</button>
  <button type="button" class="icon-btn" id="install-close" aria-label="설치 안내 닫기">✕</button>
</div>

<!-- 일반 script 로 잇는다: ES 모듈은 더블클릭(file://)으로 열면 막힌다. 자료 파일이 없어도 나머지는 뜬다 -->
<script src="teams.js"></script>
<script src="data/live.js"></script>
<script src="data/players.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>

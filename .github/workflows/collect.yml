name: 수집 → 테스트 → 배포

# 순위·경기 결과·뉴스를 모으고(scripts/collect.js), 전체 테스트를 통과하면 GitHub Pages 에 올린다.
# 명단·프로필·사진은 수집기가 20시간마다 새로 받는다.
on:
  schedule:
    # GitHub 예약은 보장되지 않는다 — 부하가 크면 늦추거나 건너뛴다(작업4 에서 몇 시간씩 밀린 적이 있다).
    # 밀려도 화면은 지난 자료로 뜨고, 바닥글이 "갱신이 늦어지고 있습니다" 로 알린다. 혼잡한 정각을 피했다.
    - cron: '17,47 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_players:
        description: '명단·프로필·사진을 지금 새로 받기'
        type: boolean
        default: false

permissions:
  contents: read

# 한 번에 하나만. 겹친 실행은 기다렸다가 돈다.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    name: 자료 수집
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # 저장소 사본(data/*.js)을 하루 한 번 커밋할 때만 쓴다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 지난 자료는 배포된 사이트에서 읽어 합친다(경기 결과·뉴스는 피드가 하루치뿐이라 쌓아 둬야 한다).
      - name: 수집
        id: collect
        env:
          PREV_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          FORCE_PLAYERS: ${{ inputs.force_players && '1' || '' }}
        run: node scripts/collect.js

      - name: 자료 파일을 다음 단계로 넘기기
        uses: actions/upload-artifact@v4
        with:
          name: data
          path: data/
          retention-days: 1

      # 저장소 사본은 file:// 로 열 때와 새로 받은 사본을 위한 것이다. git 은 지울 수 없으니 하루 한 번만 남긴다.
      - name: 저장소 사본 커밋 (순위·경기·명단이 바뀌었고, 마지막 커밋이 20시간 넘었을 때)
        if: steps.collect.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          last=$(git log -1 --format=%ct -- data/ 2>/dev/null || true)
          now=$(date +%s)
          if [ -n "$last" ] && [ $((now - last)) -lt 72000 ]; then echo "20시간 안에 커밋했음 — 건너뜀"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live.js data/players.js
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          node scripts/check-sensitive.js --staged
          git commit -m "자료 갱신: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

  # AGENTS.md 규칙 1 — 전체 테스트를 통과해야 배포로 넘어간다. 실패하면 이전 사이트가 그대로 남는다.
  test:
    name: Playwright 테스트
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 방금 모은 자료로 바꾸기
        uses: actions/download-artifact@v4
        with:
          name: data
          path: data/

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 전체 테스트 실행
        run: npx playwright test

      - name: 실패 시 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Pages 배포
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 방금 모은 자료로 바꾸기
        uses: actions/download-artifact@v4
        with:
          name: data
          path: data/

      - uses: actions/configure-pages@v5

      # 실제 페이지에 필요한 파일만 추린다. 테스트·수집기·설정·AGENTS.md 는 올리지 않는다.
      - name: 배포할 파일 모으기
        run: |
          mkdir -p _site/data _site/icons/teams
          cp index.html styles.css teams.js store.js app.js sw.js manifest.webmanifest _site/
          cp data/live.js data/players.js _site/data/
          cp icons/*.png _site/icons/
          cp icons/teams/*.svg icons/teams/*.png _site/icons/teams/
          find _site -type f

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

      - id: deployment
        uses: actions/deploy-pages@v4
